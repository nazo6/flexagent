[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
repository = "https://github.com/nazo6/flexagent"

[workspace.dependencies]
fxg-acp = { path = "crates/fxg-acp" }
fxg-db = { path = "crates/fxg-db" }
fxg-node = { path = "crates/fxg-node" }
# 内部クレート (パス依存)
fxg-protocol = { path = "crates/fxg-protocol" }
fxg-pty = { path = "crates/fxg-pty" }
fxg-server = { path = "crates/fxg-server" }
fxg-ui-assets = { path = "crates/fxg-ui-assets" }

# 外部クレート (バージョンは cargo add / cargo outdated で解決する。手書きしない)
agent-client-protocol = { version = "5.0.0", features = ["process", "unstable_session_fork"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
diffy = "0.5.2"
dirs = "7.0.0"
dunce = "1.0.5"
fs4 = { version = "1.1.0", features = ["sync"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
libc = "0.2.189"
portable-pty = "0.9.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "json", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
specta = { version = "2.0.0-rc.28", features = ["collect", "derive", "serde_json"] }
# TS 型生成用 (fxg-protocol の dev-dependencies からのみ使う)
specta-serde = "0.0.15"
specta-typescript = "0.0.15"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = {
  version = "1.54.1",
  features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
  ]
}
tokio-tungstenite = "0.30.0"
toml = "1.2.1"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# CLI パースは usage-rs (usage_rs)
usage-rs = "7.3.0"
uuid = { version = "1.29.1", features = ["serde", "v7"] }
which = "8.0.6"
win32job = "2.0.3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The "do not discard errors" lints (`let_underscore_must_use` /
# `map_err_ignore` / `disallowed_methods`) are enforced by the dedicated
# `mise run lint:errors` task for migrated crates (`fxg-protocol` / `fxg-db`
# first). Expand the package list as each crate is audited.
# `disallowed_methods` is part of `clippy::all` in recent toolchains, so it must
# stay `allow` here and be enabled explicitly by `lint:errors`.
disallowed_methods = "allow"
