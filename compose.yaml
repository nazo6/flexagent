name: flexagent

x-fxg: &fxg
  build:
    context: .
    dockerfile: Dockerfile
  image: fxg:dev
  # The image uses tini as PID 1 to reap spawned agents / provisioners.
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true

services:
  hub:
    <<: *fxg
    ports:
      - "8080:8080"
    volumes:
      - fxg-hub-data:/var/lib/flexagent
    environment:
      FXG_HUB_LISTEN_ADDR: "0.0.0.0:8080"
      # FXG_HUB_ALLOWED_HOSTS: "home-server.tailnet-xxxx.ts.net:8080,192.168.1.50:8080"
      # FXG_HUB_ALLOWED_ORIGINS: "http://home-server.tailnet-xxxx.ts.net:8080,http://192.168.1.50:8080"
      # FXG_LOG_FORMAT: json

  node:
    <<: *fxg
    # Start as a node instead of hub.
    command: ["node", "start"]
    depends_on:
      hub:
        condition: service_healthy
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - fxg-node-data:/var/lib/flexagent
      - ${FXG_WORKSPACE:-./workspace}:/workspace
    working_dir: /workspace
    environment:
      FXG_NODE_LISTEN_ADDR: "0.0.0.0:7860"
      # Node specifier (if not specified, it will be automatically numbered based on the container ID)
      FXG_NODE_ID: "docker"

volumes:
  fxg-hub-data:
  fxg-node-data:
