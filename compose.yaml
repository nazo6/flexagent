# - データは named volume に永続化する (`fxg-hub-data` = ハブ / `fxg-node-data` =
#   ノード。どちらも `FXG_HOME` = `/data`)。
# - `hub` は `fxg hub start`、`node` は `fxg node start` として起動する。
#   ノードにリポジトリを登録する: Web UI のプロジェクト画面から /workspace をスキャンする

name: flexagent

# hub / node で共有する定義 (同一イメージの `fxg hub start` / `fxg node start`)
x-fxg: &fxg
  platform: linux/amd64
  build:
    context: .
    dockerfile: Dockerfile
  image: fxg:dev
  # プロビジョナー・エージェント等の子プロセスを spawn するため、PID 1 の
  # ゾンビ回収を docker-init (tini) に任せる
  init: true
  restart: unless-stopped

services:
  hub:
    <<: *fxg
    ports:
      - "8080:8080"
    volumes:
      - fxg-hub-data:/data
    environment:
      # コンテナ内の待受アドレス (既定: 0.0.0.0:8080)。変更する場合は `ports` と揃える
      FXG_HUB_LISTEN_ADDR: "0.0.0.0:8080"
      # LAN / Tailscale 等のホスト名・IP でアクセスする場合は、Host ヘッダ検証
      # (DNS Rebinding 対策) と Origin 検証 (CSWSH 対策) の許可リストを設定する
      # (既定の許可は localhost / 127.0.0.1 / [::1] のみ)。
      # FXG_HUB_ALLOWED_HOSTS: "home-server.tailnet-xxxx.ts.net:8080,192.168.1.50:8080"
      # FXG_HUB_ALLOWED_ORIGINS: "http://home-server.tailnet-xxxx.ts.net:8080,http://192.168.1.50:8080"
      # コンテナログを JSON Lines にする (省略時は text)
      # FXG_LOG_FORMAT: json

  node:
    <<: *fxg
    # `fxg node start` として起動する (ローカル Web UI / エージェント実行を担う)
    command: ["node", "start"]
    depends_on:
      - hub
    ports:
      # ノードのローカル Web UI。Host 検証はループバック固定のため、ホストの
      # ループバックへ公開する (ホストで `fxg node start` を起動していると 7860 が競合する)
      - "127.0.0.1:7860:7860"
    volumes:
      # ノードのデータ (`node.db` / `auth_token` / `worktrees` / `snapshots` 等)
      - fxg-node-data:/data
      # エージェントに操作させるリポジトリ群 (ホスト側のパスは `FXG_WORKSPACE` で指定)
      - ${FXG_WORKSPACE:-./workspace}:/workspace
    environment:
      # コンテナ内の待受アドレス (既定: 127.0.0.1:7860)。コンテナ外へ公開するため
      # 0.0.0.0 にする (公開先は上記のとおりホストのループバックのみ)
      FXG_NODE_LISTEN_ADDR: "0.0.0.0:7860"
      # ノード識別子 / 表示名 (未指定時はコンテナ ID ベースの自動採番になる)
      FXG_NODE_ID: "docker"
      FXG_NODE_NAME: "docker"
      # ハブへのペアリングは node.db が唯一の保存先 (環境変数では設定しない)。
      # 初回セットアップは次のどちらか:
      #   1. ホストのブラウザで http://127.0.0.1:7860 → 設定 → ハブ接続 から
      #      ハブ URL (`http://hub:8080`) とトークンを入力する
      #   2. トークンを `./node_token` に置いて
      #      `- ./node_token:/data/node_token` でマウントする (rw)
      # トークンは `docker compose exec hub fxg hub pairing-token issue docker`
      # で発行する。反映に再起動は不要。
      # 中央サーバー経由 (Web UI / PWA) からの対話型 PTY を許可する場合は true
      # FXG_ALLOW_REMOTE_PTY: "true"

volumes:
  fxg-hub-data:
  fxg-node-data:
