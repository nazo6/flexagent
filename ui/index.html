<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>FlexAgent</title>
    <script>
      // Apply the stored palette before first paint to avoid a colour flash.
      (function () {
        try {
          var palette = localStorage.getItem("fxg:palette");
          if (palette === "bone" || palette === "graphite" || palette === "moss") {
            document.documentElement.dataset.palette = palette;
          }
        } catch (error) {
          /* localStorage can be unavailable; the default palette is fine. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
