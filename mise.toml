# FlexAgent 開発タスクランナー / ツールチェイン固定
#
# - ツールは mise で固定する (rust は rustup の stable を使用。MSRV は Cargo.toml の
#   rust-version を正とする)
# - タスクは `mise run <name>` で実行する
# - sqlx-cli は .sqlx (オフラインクエリデータ) 生成用 (sqlite + rustls のみ)
# - sqlx の型安全マクロは DATABASE_URL 未設定時に `.sqlx/` へ自動フォールバックする
#   (開発時に live 検証したい場合は `mise run sqlx:prepare` が DATABASE_URL を設定する)

[tools]
rust = "stable"
node = "24.21.0"
pnpm = "12.8.1"
"cargo:sqlx-cli" = { version = "0.9.0", default-features = "false", features = "sqlite,rustls" }
dprint = "0.57.4"
tombi = "1.5.8"

# ---------------------------------------------------------------------------
# フォーマット / Lint / テスト
# ---------------------------------------------------------------------------

[tasks."fmt:rust"]
description = "Rust コードを rustfmt でフォーマットする"
run = "cargo fmt --all"

[tasks."fmt:md"]
description = "Markdown を dprint でフォーマットする"
run = "dprint fmt"

[tasks."fmt:toml"]
description = "TOML を tombi でフォーマットする"
run = "tombi format"

[tasks."fmt:ui"]
description = "UI (TS / Svelte) を oxfmt でフォーマットする"
run = "pnpm --dir ui run fmt"

[tasks.fmt]
description = "全言語 (Rust / Markdown / TOML / UI) をフォーマットする"
run = [
  { task = "fmt:rust" },
  { task = "fmt:md" },
  { task = "fmt:toml" },
  { task = "fmt:ui" },
]

[tasks."fmt:check:rust"]
description = "Rust のフォーマット差分を検証する"
run = "cargo fmt --all --check"

[tasks."fmt:check:md"]
description = "Markdown のフォーマット差分を検証する"
run = "dprint check"

[tasks."fmt:check:toml"]
description = "TOML のフォーマット差分を検証する"
run = "tombi format --check"

[tasks."fmt:check:ui"]
description = "UI (TS / Svelte) のフォーマット差分を検証する"
run = "pnpm --dir ui run fmt:check"

[tasks."fmt:check"]
description = "全言語のフォーマット差分を検証する"
run = [
  { task = "fmt:check:rust" },
  { task = "fmt:check:md" },
  { task = "fmt:check:toml" },
  { task = "fmt:check:ui" },
]

[tasks."lint:rust"]
description = "clippy を警告エラー扱いで実行する"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."lint:toml"]
description = "TOML を tombi で lint する (JSON Schema 検証含む)"
run = "tombi lint"

[tasks.lint]
description = "全言語の lint を実行する"
run = [
  { task = "lint:rust" },
  { task = "lint:toml" },
]

[tasks.test]
description = "ワークスペース全体のテストを実行する (ts-rs 型出力含む)"
# --no-fail-fast: あるクレートが失敗しても全クレートの結果を報告する (CI 診断用)
run = "cargo test --workspace --no-fail-fast"

[tasks.check]
description = "fmt:check + lint + test を一括実行する (コミット前チェック)"
# 直列実行する: 並列に走らせると cargo のビルドディレクトリロックで
# 相互待ちになり遅くなるため (`{ task = ... }` は順次実行)
run = [
  { task = "fmt:check" },
  { task = "lint" },
  { task = "test" },
]

# ---------------------------------------------------------------------------
# UI (`ui/`: SvelteKit SPA)
# ---------------------------------------------------------------------------

[tasks."ui:install"]
description = "UI の依存関係を lockfile どおりに導入する"
run = "pnpm --dir ui install --frozen-lockfile"

[tasks."lint:ui"]
description = "UI を oxlint + svelte-check で検査する"
run = ["pnpm --dir ui run lint", "pnpm --dir ui run check"]

[tasks."test:ui"]
description = "UI の Vitest を実行する"
run = "pnpm --dir ui run test"

[tasks."build:ui"]
description = "UI をビルドする (ui/build。fxg バイナリへの同梱用)"
run = "pnpm --dir ui run build"

[tasks."check:ui"]
description = "UI の fmt:check + lint + test を一括実行する"
run = [
  { task = "fmt:check:ui" },
  { task = "lint:ui" },
  { task = "test:ui" },
]

# ---------------------------------------------------------------------------
# 型生成 (ts-rs) / sqlx オフラインデータ
# ---------------------------------------------------------------------------

[tasks.types]
description = "fxg-protocol から TypeScript 型を生成する (ui/src/lib/generated)"
run = "cargo test -p fxg-protocol export_bindings"

[tasks."sqlx:prepare"]
description = "開発用DBを作成・マイグレーションし .sqlx を再生成する (要コミット)"
run = """
#!/usr/bin/env bash
set -euo pipefail
export DATABASE_URL="sqlite://$PWD/target/fxg-dev.db"
mkdir -p target
sqlx database create 2>/dev/null || true
sqlx migrate run --source crates/fxg-db/migrations
cargo sqlx prepare --workspace
"""

[tasks."sqlx:check"]
description = ".sqlx がスキーマ・クエリと一致しているか検証する"
run = """
#!/usr/bin/env bash
set -euo pipefail
export DATABASE_URL="sqlite://$PWD/target/fxg-dev.db"
mkdir -p target
sqlx database create 2>/dev/null || true
sqlx migrate run --source crates/fxg-db/migrations
cargo sqlx prepare --workspace --check
"""

# ---------------------------------------------------------------------------
# 開発
# ---------------------------------------------------------------------------

[tasks."dev:ui"]
description = "UI (Vite) 開発サーバーを起動する (http://localhost:5173)"
run = "pnpm --dir ui run dev"
alias = "ui:dev"

[tasks."dev:daemon"]
description = "デバッグバイナリのローカルデーモン (`fxg daemon`) を起動する (http://127.0.0.1:7860)"
run = "cargo run -p fxg-cli -- daemon"

[tasks."dev:server"]
description = "デバッグバイナリの中央サーバー (`fxg server`) を起動する (http://0.0.0.0:8080)"
run = "cargo run -p fxg-cli -- server"

[tasks.dev]
description = "Vite 開発サーバーとデバッグバイナリ (fxg daemon) を並列起動する"
run = [
  { tasks = ["dev:ui", "dev:daemon"] },
]

# ---------------------------------------------------------------------------
# ビルド
# ---------------------------------------------------------------------------

[tasks.build]
description = "`fxg` バイナリをリリースビルドする"
run = "cargo build --release -p fxg-cli"
