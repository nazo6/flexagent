# FlexAgent 開発タスクランナー / ツールチェイン固定
#
# - ツールは mise で固定する (rust は rustup の stable を使用。MSRV は Cargo.toml の
#   rust-version を正とする)
# - タスクは `mise run <name>` で実行する
# - sqlx-cli は .sqlx (オフラインクエリデータ) 生成用 (sqlite + rustls のみ)
# - sqlx の型安全マクロは DATABASE_URL 未設定時に `.sqlx/` へ自動フォールバックする
#   (開発時に live 検証したい場合は `mise run sqlx:prepare` が DATABASE_URL を設定する)

[tools]
rust = "stable"
node = "24.21.0"
pnpm = "12.8.1"
"cargo:sqlx-cli" = { version = "0.9.0", default-features = "false", features = "sqlite,rustls" }
tombi = "1.5.8"

# ---------------------------------------------------------------------------
# フォーマット
# ---------------------------------------------------------------------------

[tasks."fmt:rust"]
description = "Rust コードを rustfmt でフォーマットする"
run = "cargo fmt --all"

[tasks."fmt:toml"]
description = "TOML を tombi でフォーマットする"
run = "tombi format"

[tasks."fmt:oxc"]
description = "Markdown / JSON / YAML / HTML / TypeScript / Svelte を oxfmt でフォーマットする"
# `oxfmt` は `ui` の devDependency。`.svelte` の整形には oxfmt と同じ
# node_modules に `svelte` が要るため ui に置いたまま、その bin を node で起動する
# (`ui/node_modules/.bin` のシェルスクリプトを避けて Windows でも動くようにする)。
run = "node ui/node_modules/oxfmt/bin/oxfmt -c .oxfmtrc.json ."

[tasks.fmt]
description = "全言語 (Rust / TOML / Markdown / JSON / YAML / UI) をフォーマットする"
run = [{ task = "fmt:rust" }, { task = "fmt:toml" }, { task = "fmt:oxc" }]

[tasks."fmt:check"]
description = "全言語のフォーマット差分を検証する"
run = [
  "cargo fmt --all --check",
  "tombi format --check",
  "node ui/node_modules/oxfmt/bin/oxfmt -c .oxfmtrc.json --check .",
]

# ---------------------------------------------------------------------------
# Lint (静的解析)
# ---------------------------------------------------------------------------

[tasks."lint:rust"]
description = "Rust の clippy を警告エラー扱いで実行する"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."lint:toml"]
description = "TOML を tombi で lint する (JSON Schema 検証含む)"
run = "tombi lint"

[tasks."lint:ui"]
description = "TypeScript / Svelte を oxlint で lint する"
run = "pnpm --dir ui run lint"

[tasks."lint:lang"]
description = "英語のみに移行済みのパスに非英語 (日本語) 文字列が混入していないか検証する"
# 【一時的なタスク】日本語から英語への移行が完了するまでのガード。
# 移行済みパスは段階的に増やす。すべて英語化できたらこのタスク自体を削除し、
# `lint` 集約タスクと CI (`.github/workflows/ci.yml`) のステップも取り除く
# (英語で書く規約は AGENTS.md に残す)。
# 意図的に日本語を残す行 (多バイト境界のテスト等) は `allow-japanese: <理由>` を
# その行に書くと除外される。
run = '''
#!/usr/bin/env bash
set -euo pipefail

targets=(
  crates/fxg-protocol
  crates/fxg-db
  crates/fxg-pty
  crates/fxg-acp
  crates/fxg-server
  crates/fxg-node
  crates/fxg-cli
  crates/fxg-ui-assets
)

# Han / Hiragana / Katakana + CJK 記号 + 全角形。
pattern='[\p{Han}\p{Hiragana}\p{Katakana}\x{3000}-\x{303F}\x{FF01}-\x{FF60}]'

if command -v rg >/dev/null 2>&1; then
  # Migration SQL is frozen: sqlx validates the checksum of applied migrations,
  # so translating comments there would break existing databases.
  hits=$(rg --line-number --no-heading --color never --pcre2 \
    --glob '!crates/fxg-db/migrations/**' \
    "$pattern" "${targets[@]}" | grep -v 'allow-japanese' || true)
else
  hits=$(grep -rnP --exclude-dir=migrations "$pattern" "${targets[@]}" | grep -v 'allow-japanese' || true)
fi

if [ -n "$hits" ]; then
  echo "error: non-English text found in paths that must be English only:" >&2
  echo "" >&2
  echo "$hits" >&2
  echo "" >&2
  echo "Write comments and user-facing messages in English." >&2
  echo "If the text is intentional, mark the line with 'allow-japanese: <reason>'." >&2
  exit 1
fi

echo "ok: ${targets[*]} contain no non-English text"
'''

[tasks.lint]
description = "全言語の lint を実行する"
run = [
  { task = "lint:lang" },
  { task = "lint:rust" },
  { task = "lint:toml" },
  { task = "lint:ui" },
]

# ---------------------------------------------------------------------------
# テスト
# ---------------------------------------------------------------------------

[tasks."test:rust"]
description = "Rust ワークスペース全体のテストを実行する (specta 型出力含む)"
# --no-fail-fast: あるクレートが失敗しても全クレートの結果を報告する (CI 診断用)
run = "cargo test --workspace --no-fail-fast"

[tasks."test:ui"]
description = "UI の Vitest を実行する"
run = "pnpm --dir ui run test"

[tasks.test]
description = "全テスト (Rust + UI) を実行する"
run = [{ task = "test:rust" }, { task = "test:ui" }]

# ---------------------------------------------------------------------------
# 検証 (Check)
# ---------------------------------------------------------------------------

[tasks."check:rust"]
description = "Rust の lint とテストを一括実行する"
run = [{ task = "lint:rust" }, { task = "test:rust" }]

[tasks."check:ui"]
description = "UI の TypeScript / Svelte 型検査を実行する (svelte-check)"
run = "pnpm --dir ui run check"

[tasks.check]
description = "fmt:check + lint + check:ui + test を一括実行する (コミット前完全チェック)"
# 直列実行する: 並列に走らせると cargo のビルドディレクトリロックで
# 相互待ちになり遅くなるため (`{ task = ... }` は順次実行)
run = [
  { task = "fmt:check" },
  { task = "lint" },
  { task = "check:ui" },
  { task = "test" },
]

# ---------------------------------------------------------------------------
# UI ビルド・導入
# ---------------------------------------------------------------------------

[tasks."ui:install"]
description = "UI の依存関係を lockfile どおりに導入する"
run = "pnpm --dir ui install --frozen-lockfile"

[tasks."build:ui"]
description = "UI をビルドする (ui/build。fxg バイナリへの同梱用)"
run = "pnpm --dir ui run build"

# ---------------------------------------------------------------------------
# 型生成 (specta) / sqlx オフラインデータ
# ---------------------------------------------------------------------------

[tasks.types]
description = "fxg-protocol から TypeScript 型を生成する (ui/src/lib/generated/bindings.ts)"
run = "cargo test -p fxg-protocol export_bindings"

[tasks."sqlx:prepare"]
description = "開発用DBを作成・マイグレーションし .sqlx を再生成する (要コミット)"
run = """
#!/usr/bin/env bash
set -euo pipefail
export DATABASE_URL="sqlite://$PWD/target/fxg-dev.db"
mkdir -p target
sqlx database create 2>/dev/null || true
sqlx migrate run --source crates/fxg-db/migrations
cargo sqlx prepare --workspace
"""

[tasks."sqlx:check"]
description = ".sqlx がスキーマ・クエリと一致しているか検証する"
run = """
#!/usr/bin/env bash
set -euo pipefail
export DATABASE_URL="sqlite://$PWD/target/fxg-dev.db"
mkdir -p target
sqlx database create 2>/dev/null || true
sqlx migrate run --source crates/fxg-db/migrations
cargo sqlx prepare --workspace --check
"""

# ---------------------------------------------------------------------------
# 開発
# ---------------------------------------------------------------------------

[tasks."dev:ui"]
description = "UI (Vite) 開発サーバーを起動する (http://localhost:5173)"
run = "pnpm --dir ui run dev"
alias = "ui:dev"

[tasks."dev:daemon"]
description = "デバッグバイナリのローカルデーモン (`fxg daemon`) を起動する (http://127.0.0.1:7860)"
run = "cargo run -p fxg-cli -- daemon"

[tasks."dev:server"]
description = "デバッグバイナリの中央サーバー (`fxg server`) を起動する (http://0.0.0.0:8080)"
run = "cargo run -p fxg-cli -- server"

[tasks.dev]
description = "Vite 開発サーバーとデバッグバイナリ (fxg daemon) を並列起動する"
run = [{ tasks = ["dev:ui", "dev:daemon"] }]

# ---------------------------------------------------------------------------
# ビルド
# ---------------------------------------------------------------------------

[tasks.build]
description = "`fxg` バイナリをリリースビルドする"
run = "cargo build --release -p fxg-cli"

[tasks."build:docker"]
description = "Docker イメージをビルドする"
# amd64 を明示する: arm64 ホストでも本番・配布と同じイメージを再現する
run = "docker compose build"
