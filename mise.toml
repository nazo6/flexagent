# Toolchain is pinned here; MSRV is Cargo.toml's `rust-version`.

[tools]
rust = "stable"
node = "24.21.0"
pnpm = "12.8.1"
# sqlx-cli only needs sqlite + rustls for `.sqlx` generation.
"cargo:sqlx-cli" = { version = "0.9.0", default-features = "false", features = "sqlite,rustls" }
# Hot restart for `mise run dev`.
watchexec = "2.8.0"
tombi = "1.5.8"

[tasks."fmt:rust"]
description = "Format Rust code with rustfmt"
run = "cargo fmt --all"

[tasks."fmt:toml"]
description = "Format TOML with tombi"
run = "tombi format"

[tasks."fmt:oxc"]
description = "Format Markdown / JSON / YAML / HTML / TypeScript / Svelte with oxfmt"
# oxfmt is a devDependency of `ui` (it needs `svelte` from the same node_modules);
# running its JS entry with node avoids the shell shim and works on Windows.
run = "node ui/node_modules/oxfmt/bin/oxfmt -c .oxfmtrc.json ."

[tasks.fmt]
description = "Format all languages (Rust / TOML / Markdown / JSON / YAML / UI)"
run = [{ task = "fmt:rust" }, { task = "fmt:toml" }, { task = "fmt:oxc" }]

[tasks."fmt:check"]
description = "Check formatting for all languages"
run = [
  "cargo fmt --all --check",
  "tombi format --check",
  "node ui/node_modules/oxfmt/bin/oxfmt -c .oxfmtrc.json --check .",
]

[tasks."lint:rust"]
description = "Run clippy on Rust with warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."lint:errors"]
description = "Reject swallowed errors and type-safety boundary violations (raw JSON / string checks / wildcard enum matches) workspace-wide"
# Extends clippy.toml's disallowed lists; existing violations stay as per-crate
# `#![allow(..., reason = "...")]` baselines (see docs/06-type-safety.md).
run = "cargo clippy --workspace --all-targets -- -D warnings -D clippy::let_underscore_must_use -D clippy::map_err_ignore -D clippy::disallowed_methods -D clippy::disallowed_types -D clippy::wildcard_enum_match_arm"

[tasks."lint:toml"]
description = "Lint TOML with tombi (including JSON Schema validation)"
run = "tombi lint"

[tasks."lint:ui"]
description = "Lint TypeScript / Svelte with oxlint"
run = "pnpm --dir ui run lint"

[tasks.lint]
description = "Run lint for all languages"
run = [
  { task = "lint:rust" },
  { task = "lint:errors" },
  { task = "lint:toml" },
  { task = "lint:ui" },
]

[tasks."test:rust"]
description = "Run the whole Rust workspace test suite (including specta type export)"
run = "cargo test --workspace --no-fail-fast"

[tasks."test:ui"]
description = "Run UI tests with Vitest"
run = "pnpm --dir ui run test"

[tasks.test]
description = "Run all tests (Rust + UI)"
run = [{ task = "test:rust" }, { task = "test:ui" }]

[tasks."check:rust"]
description = "Run Rust lint and tests together"
run = [{ task = "lint:rust" }, { task = "test:rust" }]

[tasks."check:ui"]
description = "Type-check UI TypeScript / Svelte (svelte-check)"
run = "pnpm --dir ui run check"

[tasks.check]
description = "Pre-commit full check: fmt:check + lint + check:ui + test"
# Sequential: parallel runs would contend on cargo's build directory lock.
run = [
  { task = "fmt:check" },
  { task = "lint" },
  { task = "check:ui" },
  { task = "test" },
]

[tasks."ui:install"]
description = "Install UI dependencies exactly as locked"
run = "pnpm --dir ui install --frozen-lockfile"

[tasks."build:ui"]
description = "Build the UI (ui/build, bundled into the fxg binary)"
run = "pnpm --dir ui run build"

[tasks.types]
description = "Generate TypeScript types from fxg-protocol (ui/src/lib/generated/bindings.ts)"
run = "cargo test -p fxg-protocol export_bindings"

[tasks."sqlx:prepare"]
description = "Create and migrate the dev database, then regenerate .sqlx (commit the result)"
run = """
#!/usr/bin/env bash
set -euo pipefail
export DATABASE_URL="sqlite://$PWD/target/fxg-dev.db"
mkdir -p target
sqlx database create 2>/dev/null || true
sqlx migrate run --source crates/fxg-db/migrations
cargo sqlx prepare --workspace -- --all-targets
"""

[tasks."sqlx:check"]
description = "Verify .sqlx matches the schema and queries"
run = """
#!/usr/bin/env bash
set -euo pipefail
export DATABASE_URL="sqlite://$PWD/target/fxg-dev.db"
mkdir -p target
sqlx database create 2>/dev/null || true
sqlx migrate run --source crates/fxg-db/migrations
cargo sqlx prepare --workspace --check -- --all-targets
"""

[tasks."dev:ui"]
description = "Start the UI (Vite) dev server (http://localhost:5173)"
run = "pnpm --dir ui run dev"

[tasks."dev:node"]
description = "Start the debug local node, rebuilding and restarting on Rust changes (http://127.0.0.1:7860)"
# Only crates/ and Cargo files: the UI is covered by Vite HMR. SIGINT gives the
# node a graceful shutdown (on Windows watchexec maps it to CTRL+C).
run = "watchexec -r -w crates -w Cargo.toml -w Cargo.lock --stop-signal SIGINT -- cargo run -p fxg-cli -- node start"

[tasks."dev:hub"]
description = "Start the debug hub, rebuilding and restarting on Rust changes (http://0.0.0.0:8080)"
run = "watchexec -r -w crates -w Cargo.toml -w Cargo.lock --stop-signal SIGINT -- cargo run -p fxg-cli -- hub start"

[tasks.dev]
description = "Start the Vite dev server and the debug binary (`fxg node start`) in parallel (UI via HMR, Rust restarts on change)"
run = [{ tasks = ["dev:ui", "dev:node"] }]

[tasks.build]
description = "Build the `fxg` binary in release mode"
run = "cargo build --release -p fxg-cli"

[tasks."build:docker"]
description = "Build the Docker image"
# Pin amd64 so arm64 hosts reproduce the production/distributed image.
run = "docker compose build"
