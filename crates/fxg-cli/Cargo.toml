[package]
name = "fxg-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FlexAgent CLI / TUI エントリポイント (fxg バイナリ)"
repository.workspace = true

[[bin]]
name = "fxg"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
crossterm = { workspace = true }
dirs.workspace = true
fxg-acp = { workspace = true }
fxg-db = { workspace = true }
fxg-node = { workspace = true }
fxg-protocol = { workspace = true }
fxg-pty = { workspace = true }
fxg-server = { workspace = true }
libc.workspace = true
opener = "0.9.0"
png = "0.18"
ratatui = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-width = { workspace = true }
usage = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
usage = { workspace = true, features = ["test"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "macos")'.dependencies]
tao = "0.37"
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
