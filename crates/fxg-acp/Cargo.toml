[package]
name = "fxg-acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FlexAgent agent drivers (ACP Registry / AcpDriver / OpenCode2Driver)"
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "fxg-mock-acp"
path = "tests/fixtures/mock_agent.rs"
test = false

[dependencies]
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
diffy = { workspace = true }
futures-util = { workspace = true }
fxg-protocol = { workspace = true }
fxg-pty = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["acp-session-fork", "acp-subagents"]
acp-all = ["acp-plan", "acp-session-fork", "acp-subagents"]
acp-plan = ["agent-client-protocol/unstable_plan_operations"]
# ACP unstable features supported by fxg-acp. Add new features here and to
# `acp-all` so a single build flag can enable every supported extension.
acp-session-fork = ["agent-client-protocol/unstable_session_fork"]
acp-subagents = ["agent-client-protocol/unstable_subagents"]

[lints]
workspace = true
