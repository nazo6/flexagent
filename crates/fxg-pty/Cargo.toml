[package]
name = "fxg-pty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FlexAgent PTY 制御 (ConPTY / Unix PTY) と Windows Job Object によるプロセスツリー管理"
repository.workspace = true

[dependencies]
dunce = { workspace = true }
fxg-protocol = { workspace = true }
portable-pty = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
which = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target."cfg(unix)".dependencies]
libc = { workspace = true }

[target."cfg(windows)".dependencies]
win32job = { workspace = true }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true
