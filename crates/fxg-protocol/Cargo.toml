[package]
name = "fxg-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "FlexAgent shared type definitions and protocol messages (specta-enabled)"
repository.workspace = true

[dependencies]
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
specta-serde = { workspace = true }
specta-typescript = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
# Implement `sqlx::Type` / `Encode` / `Decode` for the string enums so `fxg-db` can
# use them directly as TEXT column fields.
sqlx = ["dep:sqlx"]
# Expose dummy builders for large protocol structs to downstream tests. Enable it
# from a `[dev-dependencies]` entry so production builds do not include them.
testing = []

[lints]
workspace = true
